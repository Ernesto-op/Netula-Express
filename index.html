<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netula Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#FAF7F2;
    --paper-2:#F1EAE0;
    --ink:#24211D;
    --ink-soft:#5B564E;
    --line:#E4DCCC;
    --brick:#A6402F;
    --brick-dark:#7E301F;
    --olive:#6B7A4C;
    --whatsapp:#25D366;
    --whatsapp-dark:#1DA851;
    --card:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', serif;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:15px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:720px; margin:0 auto; padding:16px 18px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{display:flex; flex-direction:column; min-width:0;}
  .brand h1{margin:0; font-size:22px; font-weight:600; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand span{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .mode-switch{
    display:flex; gap:6px; background:var(--paper-2); padding:4px; border-radius:999px; flex-shrink:0;
  }
  .mode-switch button{
    border:none; background:transparent; padding:7px 12px; border-radius:999px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .mode-switch button.active{background:var(--ink); color:var(--paper);}

  .container{max-width:720px; margin:0 auto; padding:18px 18px 120px;}

  /* ---------- Category tabs ---------- */
  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:10px 14px; margin-bottom:14px;
  }
  .search input{border:none; outline:none; flex:1; background:transparent; font-size:14.5px; color:var(--ink);}
  .tabs{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0; border:1px solid var(--line); background:var(--card);
    padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    white-space:nowrap;
  }
  .tab.active{background:var(--brick); border-color:var(--brick); color:#fff;}

  .cat-menu{display:flex; flex-direction:column; gap:10px;}
  .cat-menu-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 16px; text-align:left; width:100%;
  }
  .cat-menu-item span:first-child{font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--ink);}
  .cat-menu-count{font-size:12.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap;}
  .back-link{
    border:none; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:600;
    padding:0 0 14px; display:block;
  }
  .cat-view-title{font-size:22px; margin:0 0 16px;}

  /* ---------- Product cards (grid de 2 columnas) ---------- */
  .product-list{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .product{
    display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden;
  }
  .product .thumb{
    width:100%; aspect-ratio:1/1; border-radius:0; flex-shrink:0; overflow:hidden;
    background:var(--paper-2); display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size:34px; color:var(--olive); font-weight:600;
  }
  .product .thumb img{width:100%; height:100%; object-fit:cover;}
  .product .info{flex:1; min-width:0; padding:10px 12px 4px;}
  .product .info h3{margin:0 0 4px; font-size:14.5px; font-weight:600; line-height:1.3;}
  .product .info p{margin:0 0 6px; font-size:12px; color:var(--ink-soft); line-height:1.35;}
  .product .price{font-weight:700; font-size:14.5px; color:var(--brick-dark);}
  .product .card-actions{padding:8px 12px 12px;}
  .qty-row{display:flex; align-items:center; justify-content:center; gap:10px; width:100%;}
  .qty-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
    font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--ink);
    flex-shrink:0;
  }
  .qty-val{min-width:16px; text-align:center; font-weight:600; font-size:14px;}
  .add-btn{
    border:none; background:var(--ink); color:#fff; border-radius:999px; padding:9px 14px;
    font-size:13px; font-weight:600; width:100%;
  }
  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty .serif{font-size:19px; color:var(--ink); display:block; margin-bottom:6px;}


  /* ---------- Floating cart ---------- */
  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--ink); color:#fff;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .cart-bar-inner{
    max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .cart-bar .cart-info{font-size:13.5px; line-height:1.3;}
  .cart-bar .cart-info b{font-family:'Fraunces', serif; font-size:16px; display:block;}
  .cart-bar button{
    border:none; background:var(--whatsapp); color:#fff; padding:11px 18px; border-radius:999px;
    font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; flex-shrink:0;
  }

  /* ---------- Modal (cart detail) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(36,33,29,.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:720px; border-radius:20px 20px 0 0;
    max-height:85vh; overflow-y:auto; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h2{margin:0 0 14px; font-size:20px;}
  .cart-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .cart-line .name{flex:1; font-size:14.5px; font-weight:600;}
  .cart-line .sub{font-size:12px; color:var(--ink-soft); font-weight:400;}
  .cart-total-row{display:flex; justify-content:space-between; padding:14px 0 6px; font-weight:700; font-size:16px;}
  .close-x{
    position:absolute; top:14px; right:14px; border:none; background:var(--paper-2); width:30px; height:30px;
    border-radius:50%; font-size:16px; color:var(--ink-soft);
  }
  .sheet-wrap{position:relative;}
  .send-btn{
    width:100%; border:none; background:var(--whatsapp); color:#fff; padding:14px; border-radius:12px;
    font-weight:700; font-size:15px; margin-top:14px;
  }

  /* ---------- Admin ---------- */
  .section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
  .section-title h2{font-size:18px; margin:0;}
  .section-title:first-child{margin-top:0;}
  .pill-btn{
    border:1px solid var(--line); background:var(--card); padding:7px 13px; border-radius:999px;
    font-size:13px; font-weight:600; color:var(--ink);
  }
  .pill-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .admin-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;
  }
  .admin-card .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .admin-card .row + .row{margin-top:6px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field textarea, .field select{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:var(--paper); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .icon-btn{border:none; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; padding:4px 6px;}
  .icon-btn.danger{color:var(--brick-dark);}
  .form-actions{display:flex; gap:10px; margin-top:4px;}
  .form-actions .pill-btn{flex:1; text-align:center;}
  .muted{color:var(--ink-soft); font-size:13px;}
  .pin-wrap{
    max-width:320px; margin:80px auto; text-align:center; padding:0 20px;
  }
  .pin-wrap input{
    width:100%; text-align:center; letter-spacing:6px; font-size:22px; padding:12px; margin:16px 0;
    border:1px solid var(--line); border-radius:10px; background:var(--card);
  }
  .cat-chip{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card);
    padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600; margin:0 8px 8px 0;
  }
  .cat-chip button{border:none; background:transparent; color:var(--ink-soft); font-size:14px; line-height:1; padding:0;}
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 16px; border-radius:999px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .toast.show{opacity:1;}
  .img-picker{display:flex; align-items:center; gap:12px;}
  .img-preview{
    width:64px; height:64px; border-radius:10px; overflow:hidden; flex-shrink:0;
    background:var(--paper-2); display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:11px; text-align:center; border:1px solid var(--line);
  }
  .img-preview img{width:100%; height:100%; object-fit:cover;}
  .file-btn-wrap{position:relative; overflow:hidden; display:inline-block;}
  .file-btn-wrap input[type=file]{
    position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer;
  }
  .remove-img{border:none; background:transparent; color:var(--brick-dark); font-size:12.5px; font-weight:600; margin-left:auto;}
  .loading{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .search button{border:none;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;flex-shrink:0;}
  .pill-btn:disabled{opacity:.4;}
  .check-row{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:4px 0 12px;}
  .cat-edit-row{margin-bottom:8px;align-items:center;}
  .admin-filter{width:100%;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--card);margin-bottom:8px;font-size:14px;}
  .photo-filters{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .photo-filters select{flex:1;min-width:140px;border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:var(--card);}
  .photo-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
  .photo-card h3{margin:6px 0 2px;font-size:18px;}
  .photo-big{width:100%;max-width:340px;aspect-ratio:1/1;margin:0 auto 12px;border-radius:14px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);overflow:hidden;}
  .photo-big img{width:100%;height:100%;object-fit:cover;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
// ====== CONEXIÓN A LA BASE DE DATOS (Firebase) ======
// Reemplaza esto con el bloque "firebaseConfig" que te da la consola de Firebase
// (Configuración del proyecto → Tus apps → ícono </> ).
const firebaseConfig = {
  apiKey: "AIzaSyBIMuNTRL6D-bq7um-2trTNlomNPKX_RVo",
  authDomain: "netula-express.firebaseapp.com",
  projectId: "netula-express",
  storageBucket: "netula-express.firebasestorage.app",
  messagingSenderId: "874074235235",
  appId: "1:874074235235:web:769aa498ee098a151f3356"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FS_COLLECTION = 'catalogo';

async function fsGet(key){
  try{
    const snap = await db.collection(FS_COLLECTION).doc(key).get();
    return snap.exists ? snap.data().json : null;
  }catch(e){
    console.error('fsGet error', key, e);
    return null;
  }
}
async function fsSet(key, jsonStr){
  try{
    await db.collection(FS_COLLECTION).doc(key).set({json: jsonStr});
    return true;
  }catch(e){
    console.error('fsSet error', key, e);
    return false;
  }
}
// ====== FIN CONEXIÓN ======

const STORAGE_KEY = 'catalogo-data-v1';
let state = null;
let mode = 'cliente'; // cliente | admin | pin
let activeCategory = null; // null = mostrar el menú de categorías
let searchTerm = '';
let cart = {}; // productId -> qty
let showCartSheet = false;
let editingProduct = null; // {} for new, or product object copy
let editingCategoryName = '';
let pinInput = '';
let pinError = '';
let searchInput = '', searchQuery = '';
let adminView = 'main', photoFilter = 'sin', photoCat = 'all', photoIdx = 0;
let adminQuery = '', adminSearchInput = '', adminCatFilter = 'all';

function uid(){ return Math.random().toString(36).slice(2,10); }

// Fotos: se guardan en paquetes chicos por categoría (Firestore limita cada documento a 1 MB)
const CHUNK_SIZE = 12;
let imageChunks = {};
const chunkPromises = {};
let legacyImages = {};
let migrationPromise = null;
let visibleForImages = [];

function productById(id){ return state.products.find(p=>p.id===id); }
function hasImage(p){ return !!(p.imgKey || legacyImages[p.id]); }
function getProductImage(id){
  const p = productById(id);
  if(p && p.imgKey && imageChunks[p.imgKey] && imageChunks[p.imgKey][id]) return imageChunks[p.imgKey][id];
  return legacyImages[id] || '';
}
function loadChunk(key){
  if(!chunkPromises[key]){
    chunkPromises[key] = db.collection(FS_COLLECTION).doc('catalogo-img-'+key).get()
      .then(snap=>{ imageChunks[key] = snap.exists ? JSON.parse(snap.data().json) : {}; })
      .catch(()=>{ delete chunkPromises[key]; delete imageChunks[key]; });
  }
  return chunkPromises[key];
}
function ensureImages(list){
  const keys = new Set();
  list.forEach(p=>{ if(p.imgKey && !imageChunks[p.imgKey]) keys.add(p.imgKey); });
  keys.forEach(k=> loadChunk(k).then(hydrateThumbs));
}
function hydrateThumbs(){
  document.querySelectorAll('[data-pid]').forEach(el=>{
    if(el.querySelector('img')) return;
    const url = getProductImage(el.getAttribute('data-pid'));
    if(url) el.innerHTML = '<img src="'+url+'" alt="" loading="lazy" decoding="async">';
  });
}
async function pickChunkKey(p, len){
  const cat = p.categoryId || 'x';
  for(let n=0;;n++){
    const key = cat+'-'+n;
    if(state.products.filter(q=>q.imgKey===key).length >= CHUNK_SIZE) continue;
    await loadChunk(key);
    if(!imageChunks[key]) return null;
    if(JSON.stringify(imageChunks[key]).length + len < 800000) return key;
  }
}
async function setProductImage(p, dataUrl){
  if(migrationPromise) await migrationPromise;
  let key = p.imgKey;
  if(!dataUrl){
    if(key){
      await loadChunk(key);
      if(imageChunks[key]){ delete imageChunks[key][p.id]; await fsSet('catalogo-img-'+key, JSON.stringify(imageChunks[key])); }
      delete p.imgKey; await saveData();
    }
    delete legacyImages[p.id];
    return true;
  }
  if(!key) key = await pickChunkKey(p, dataUrl.length);
  if(key) await loadChunk(key);
  if(!key || !imageChunks[key]){ showToast('Sin conexión. Intenta de nuevo.'); return false; }
  imageChunks[key][p.id] = dataUrl;
  const ok = await fsSet('catalogo-img-'+key, JSON.stringify(imageChunks[key]));
  if(!ok){ delete imageChunks[key][p.id]; showToast('No se pudo guardar la foto.'); return false; }
  if(p.imgKey !== key){ p.imgKey = key; await saveData(); }
  delete legacyImages[p.id];
  return true;
}
function migrateLegacyImages(){
  if(state.imgMigrated || migrationPromise) return;
  const entries = Object.entries(legacyImages).filter(([pid])=>productById(pid) && !productById(pid).imgKey);
  migrationPromise = (async()=>{
    try{
      if(entries.length) showToast('Optimizando fotos, un momento…');
      const dirty = new Set();
      for(const [pid,url] of entries){
        const p = productById(pid);
        const key = await pickChunkKey(p, url.length);
        if(!key) throw new Error('offline');
        imageChunks[key][pid] = url; p.imgKey = key; dirty.add(key);
      }
      for(const key of dirty){
        if(!(await fsSet('catalogo-img-'+key, JSON.stringify(imageChunks[key])))) throw new Error('chunk');
      }
      state.imgMigrated = true;
      if(!(await fsSet(STORAGE_KEY, JSON.stringify(state)))) throw new Error('meta');
      for(let i=0;i<12;i++) await fsSet('catalogo-img-'+i, '{}');
      legacyImages = {};
      if(entries.length) showToast('Fotos listas ✓');
    }catch(e){
      console.error(e);
      entries.forEach(([pid])=>{ const p = productById(pid); if(p) delete p.imgKey; });
      delete state.imgMigrated;
    }
    migrationPromise = null;
    render();
  })();
}

function seedData(){
  const cat1 = uid(), cat2 = uid();
  return {
    businessName: 'Netula Express',
    tagline: 'Escoge tus productos y envía tu pedido por WhatsApp',
    whatsappNumber: '',
    adminPin: '1234',
    categories: [
      {id: cat1, name: 'Destacados'},
      {id: cat2, name: 'Nuevos'}
    ],
    products: [
      {id: uid(), categoryId: cat1, name: 'Producto de ejemplo', price: 10.00, description: 'Edita este producto desde el panel de administrador.'}
    ]
  };
}

async function loadData(){
  const metaJson = await fsGet(STORAGE_KEY);
  state = metaJson ? JSON.parse(metaJson) : seedData();
  if(!state.imgMigrated){
    await Promise.all(Array.from({length:12}, (_,i)=> fsGet('catalogo-img-'+i).then(j=>{ if(j) Object.assign(legacyImages, JSON.parse(j)); })));
  }
  render();
}

async function saveData(){
  const ok = await fsSet(STORAGE_KEY, JSON.stringify(state));
  if(!ok) showToast('No se pudo guardar. Revisa tu conexión.');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function fmt(n){
  return 'S/ ' + Number(n||0).toFixed(2);
}

function cartCount(){
  return Object.values(cart).reduce((a,b)=>a+b,0);
}
function cartTotal(){
  let t = 0;
  for(const pid in cart){
    const p = state.products.find(x=>x.id===pid);
    if(p) t += p.price * cart[pid];
  }
  return t;
}

function addToCart(pid, delta){
  const next = (cart[pid]||0) + delta;
  if(next <= 0){ delete cart[pid]; } else { cart[pid] = next; }
  render();
}

function buildWhatsAppMessage(){
  let lines = [`Hola, quiero hacer este pedido:`, ``];
  for(const pid in cart){
    const p = state.products.find(x=>x.id===pid);
    if(!p) continue;
    lines.push(`• ${p.name} x${cart[pid]} — ${fmt(p.price*cart[pid])}`);
  }
  lines.push(``, `Total: ${fmt(cartTotal())}`);
  return lines.join('\n');
}

function sendOrder(){
  if(!state.whatsappNumber){
    showToast('El negocio aún no configuró su número de WhatsApp.');
    return;
  }
  const num = state.whatsappNumber.replace(/[^0-9]/g,'');
  const msg = encodeURIComponent(buildWhatsAppMessage());
  window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
}

// ---------- Admin actions ----------
function checkPin(){
  if(pinInput === (state.adminPin || '1234')){
    mode = 'admin'; pinInput=''; pinError=''; migrateLegacyImages();
  }else{
    pinError = 'PIN incorrecto';
  }
  render();
}

function addCategory(){
  const name = editingCategoryName.trim();
  if(!name) return;
  state.categories.push({id: uid(), name});
  editingCategoryName = '';
  saveData(); render();
}
function removeCategory(id){
  const hasProducts = state.products.some(p=>p.categoryId===id);
  if(hasProducts){
    showToast('Primero mueve o borra los productos de esta categoría.');
    return;
  }
  state.categories = state.categories.filter(c=>c.id!==id);
  saveData(); render();
}

function renameCategory(id){
  const inp = document.querySelector('[data-cat-input="'+id+'"]');
  const name = inp ? inp.value.trim() : '';
  const c = state.categories.find(x=>x.id===id);
  if(!name || !c){ showToast('Escribe un nombre.'); return; }
  c.name = name; saveData(); showToast('Nombre actualizado'); render();
}

function downloadTemplate(){
  const csv = "Categoria,Producto,Precio,Descripcion\nBebidas,Gaseosa 500ml,3.50,Bien fria\nComidas,Hamburguesa clasica,12.00,Con papas incluidas\n";
  const blob = new Blob(["\uFEFF" + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'plantilla-productos.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parsePrice(val){
  if(typeof val === 'number') return val;
  const cleaned = String(val||'').replace(/[^0-9.,-]/g,'').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function handleExcelImport(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length === 0){ showToast('El archivo está vacío.'); return; }

      const catMap = {};
      state.categories.forEach(c=> catMap[c.name.trim().toLowerCase()] = c.id);

      let created = 0, catsCreated = 0;
      rows.forEach(row=>{
        const prodName = String(row.Producto || row.producto || row.Product || '').trim();
        if(!prodName) return;
        const catName = String(row.Categoria || row.categoria || row.Category || '').trim();
        const price = parsePrice(row.Precio ?? row.precio ?? row.Price ?? 0);
        const desc = String(row.Descripcion || row.descripcion || row.Description || '').trim();

        const key = catName ? catName.toLowerCase() : 'sin categoría';
        let catId = catMap[key];
        if(!catId){
          catId = uid();
          state.categories.push({id: catId, name: catName || 'Sin categoría'});
          catMap[key] = catId;
          catsCreated++;
        }

        state.products.push({id: uid(), categoryId: catId, name: prodName, price, description: desc});
        created++;
      });

      if(created===0){
        showToast('No se encontró ningún producto válido en el archivo.');
        return;
      }
      saveData();
      render();
      showToast(`Se importaron ${created} productos${catsCreated? ` y se crearon ${catsCreated} categorías`:''}.`);
    }catch(err){
      console.error(err);
      showToast('No se pudo leer el archivo. Revisa que sea un Excel o CSV válido.');
    }
  };
  reader.onerror = ()=> showToast('No se pudo leer el archivo.');
  reader.readAsArrayBuffer(file);
}

function startNewProduct(){

}
async function startEditProduct(p){
  if(p.imgKey) await loadChunk(p.imgKey);
  editingProduct = {...p, image:getProductImage(p.id), imageChanged:false};
  render();
}
function compressImageFile(file, done){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 480; let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      done(c.toDataURL('image/jpeg', 0.62));
    };
    img.onerror = ()=>{ showToast('No se pudo leer esa imagen.'); done(null); };
    img.src = e.target.result;
  };
  reader.onerror = ()=>{ showToast('No se pudo leer esa imagen.'); done(null); };
  reader.readAsDataURL(file);
}
function handleImageFile(file){
  compressImageFile(file, url=>{
    if(url && editingProduct){ editingProduct.image = url; editingProduct.imageChanged = true; render(); }
  });
}
async function saveProduct(){
  const e = editingProduct;
  if(!e.name.trim() || e.price===''){ showToast('Falta el nombre o el precio.'); return; }
  const data = {categoryId:e.categoryId, name:e.name.trim(), price:parseFloat(e.price), description:e.description, featured:!!e.featured};
  let p;
  if(e.id){ p = productById(e.id); Object.assign(p, data); }
  else{ p = {id:uid(), ...data}; state.products.push(p); }
  editingProduct = null;
  await saveData(); render();
  if(e.imageChanged){ await setProductImage(p, e.image || ''); render(); }
}
function deleteProduct(id){
  const p = productById(id); if(!p) return;
  if(!confirm('¿Borrar "'+p.name+'"?')) return;
  const key = p.imgKey;
  state.products = state.products.filter(x=>x.id!==id);
  saveData(); render();
  if(key) loadChunk(key).then(()=>{
    if(imageChunks[key]){ delete imageChunks[key][id]; fsSet('catalogo-img-'+key, JSON.stringify(imageChunks[key])); }
  });
}
function toggleFeatured(id){
  const p = productById(id); if(!p) return;
  p.featured = !p.featured; saveData(); render();
}
function photoQueue(){
  const order = {}; state.categories.forEach((c,i)=>order[c.id]=i);
  let list = state.products.map((p,i)=>({p,i}))
    .sort((a,b)=>((order[a.p.categoryId] ?? 99)-(order[b.p.categoryId] ?? 99)) || (a.i-b.i)).map(x=>x.p);
  if(photoCat !== 'all') list = list.filter(p=>p.categoryId===photoCat);
  if(photoFilter === 'sin') list = list.filter(p=>!hasImage(p));
  return list;
}
function handlePhotoFile(file){
  const p = photoQueue()[photoIdx]; if(!p) return;
  showToast('Guardando foto…');
  compressImageFile(file, async url=>{
    if(!url) return;
    const ok = await setProductImage(p, url);
    if(ok){ if(photoFilter === 'todos') photoIdx++; showToast('Foto guardada ✓'); }
    render();
  });
}

function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function searchProducts(list, q){
  const phrase = norm(q).trim(), words = phrase.split(/\s+/).filter(Boolean);
  return list.filter(p=>{ const h = norm(p.name+' '+(p.description||'')); return words.every(w=>h.includes(w)); })
    .sort((a,b)=>(norm(a.name).includes(phrase)?0:1)-(norm(b.name).includes(phrase)?0:1));
}
function doSearch(){
  const f = document.getElementById('search-field');
  searchInput = f ? f.value.trim() : ''; searchQuery = searchInput; render(); window.scrollTo(0,0);
}
function doAdminSearch(){
  const f = document.getElementById('admin-search');
  adminSearchInput = f ? f.value.trim() : ''; adminQuery = adminSearchInput; render();
}

// ---------- Render ----------
function render(){
  const root = document.getElementById('root');
  if(!state){ root.innerHTML = '<div class="loading">Cargando catálogo…</div>'; return; }

  if(mode === 'pin'){
    root.innerHTML = renderPin();
    bindPin();
    return;
  }

  visibleForImages = [];
  let html = renderTopbar();
  if(mode === 'cliente'){
    html += renderCliente();
  }else{
    html += renderAdmin();
  }
  root.innerHTML = html;
  bindEvents();
  ensureImages(visibleForImages);
  hydrateThumbs();
}

function bindPin(){
  const field = document.getElementById('pin-field');
  field.focus();
  field.oninput = e => pinInput = e.target.value;
  field.onkeydown = e => { if(e.key==='Enter') checkPin(); };
  document.getElementById('pin-submit').onclick = checkPin;
  document.getElementById('pin-cancel').onclick = () => { mode='cliente'; pinInput=''; pinError=''; render(); };
}

  return state.products.filter(p=>p.categoryId===catId).length;
}

  return `<div class="product"><div class="thumb" data-pid="${p.id}">${img ? `<img src="${img}" alt="" loading="lazy" decoding="async">` : (hasImage(p) ? '' : escapeHtml((p.name||'?').charAt(0).toUpperCase()))}</div>

    html += `<div class="cat-menu">` + state.categories.map(c=>{
      const n = categoryProductCount(c.id);
      return `<button class="cat-menu-item" data-cat="${c.id}"><span>${escapeHtml(c.name)}</span><span class="cat-menu-count">${n} producto${n!==1?'s':''} ›</span></button>`;

function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function bindEvents(){
  const root = document.getElementById('root');

  const goCliente = root.querySelector('[data-action="go-cliente"]');
  if(goCliente) goCliente.onclick = ()=>{ mode='cliente'; render(); };
  const goAdmin = root.querySelector('[data-action="go-admin"]');
  if(goAdmin) goAdmin.onclick = ()=>{ mode = (mode==='admin') ? 'admin' : 'pin'; render(); };

  if(mode==='cliente'){
    const sf = document.getElementById('search-field');
    if(sf){ sf.oninput = e=>{ searchInput = e.target.value; }; sf.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); doSearch(); } }; }
    const sb = document.getElementById('search-btn'); if(sb) sb.onclick = doSearch;
    const bfs = document.getElementById('back-from-search'); if(bfs) bfs.onclick = ()=>{ searchQuery=''; searchInput=''; render(); };

    root.querySelectorAll('[data-cat]').forEach(btn=>{
      btn.onclick = ()=>{ activeCategory = btn.getAttribute('data-cat'); searchInput=''; searchQuery=''; render(); };
    });
    const backToMenu = document.getElementById('back-to-menu');
    if(backToMenu) backToMenu.onclick = ()=>{ activeCategory = null; searchInput=''; searchQuery=''; render(); };
    root.querySelectorAll('[data-add]').forEach(btn=>{
      btn.onclick = ()=> addToCart(btn.getAttribute('data-add'), 1);
    });
    root.querySelectorAll('[data-inc]').forEach(btn=>{
      btn.onclick = ()=> addToCart(btn.getAttribute('data-inc'), 1);
    });
    root.querySelectorAll('[data-dec]').forEach(btn=>{
      btn.onclick = ()=> addToCart(btn.getAttribute('data-dec'), -1);
    });
    const openCart = document.getElementById('open-cart');
    if(openCart) openCart.onclick = ()=>{ showCartSheet=true; render(); };
    const closeSheet = document.getElementById('close-sheet');
    if(closeSheet) closeSheet.onclick = ()=>{ showCartSheet=false; render(); };
    const overlay = document.getElementById('overlay');
    if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='overlay'){ showCartSheet=false; render(); } };
    const sendBtn = document.getElementById('send-order');
    if(sendBtn) sendBtn.onclick = sendOrder;
  }

  if(mode==='admin'){
    const saveSettings = document.getElementById('save-settings');
    if(saveSettings) saveSettings.onclick = ()=>{
      state.businessName = document.getElementById('f-business').value.trim() || 'Mi Catálogo';
      state.tagline = document.getElementById('f-tagline').value.trim();
      state.whatsappNumber = document.getElementById('f-whatsapp').value.trim();
      state.adminPin = document.getElementById('f-pin').value.trim() || '1234';
      saveData(); showToast('Datos guardados'); render();
    };

    const dlTemplate = document.getElementById('download-template');
    if(dlTemplate) dlTemplate.onclick = downloadTemplate;
    const importFile = document.getElementById('import-excel-file');
    if(importFile) importFile.onchange = e=>{ if(e.target.files[0]) handleExcelImport(e.target.files[0]); };

    const newCat = document.getElementById('new-cat');
    if(newCat) newCat.oninput = e=> editingCategoryName = e.target.value;
    const addCat = document.getElementById('add-cat');
    if(addCat) addCat.onclick = addCategory;
    root.querySelectorAll('[data-del-cat]').forEach(btn=>{
      btn.onclick = ()=> removeCategory(btn.getAttribute('data-del-cat'));
    });

    root.querySelectorAll('[data-rename-cat]').forEach(b=>{ b.onclick = ()=> renameCategory(b.getAttribute('data-rename-cat')); });
    const op = document.getElementById('open-photos'); if(op) op.onclick = ()=>{ adminView='photos'; photoIdx=0; editingProduct=null; render(); window.scrollTo(0,0); };
    const as = document.getElementById('admin-search');
    if(as){ as.oninput = e=>{ adminSearchInput = e.target.value; }; as.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdminSearch(); } }; }
    const asb = document.getElementById('admin-search-btn'); if(asb) asb.onclick = doAdminSearch;
    const asc = document.getElementById('admin-search-clear'); if(asc) asc.onclick = ()=>{ adminQuery=''; adminSearchInput=''; render(); };
    const acf = document.getElementById('admin-cat-filter'); if(acf) acf.onchange = e=>{ adminCatFilter = e.target.value; render(); };
    root.querySelectorAll('[data-toggle-feat]').forEach(b=>{ b.onclick = ()=> toggleFeatured(b.getAttribute('data-toggle-feat')); });
    const pb = document.getElementById('photos-back'); if(pb) pb.onclick = ()=>{ adminView='main'; render(); };
    root.querySelectorAll('[data-pfilter]').forEach(b=>{ b.onclick = ()=>{ photoFilter=b.getAttribute('data-pfilter'); photoIdx=0; render(); }; });
    const pc = document.getElementById('photo-cat'); if(pc) pc.onchange = e=>{ photoCat=e.target.value; photoIdx=0; render(); };
    const pf = document.getElementById('photo-file'); if(pf) pf.onchange = e=>{ if(e.target.files[0]) handlePhotoFile(e.target.files[0]); };
    const pk = document.getElementById('photo-skip'); if(pk) pk.onclick = ()=>{ photoIdx++; render(); };
    const pp = document.getElementById('photo-prev'); if(pp) pp.onclick = ()=>{ photoIdx=Math.max(0,photoIdx-1); render(); };
    const pr = document.getElementById('photo-restart'); if(pr) pr.onclick = ()=>{ photoIdx=0; render(); };
    const newProduct = document.getElementById('new-product');
    if(newProduct) newProduct.onclick = startNewProduct;
    root.querySelectorAll('[data-edit-product]').forEach(btn=>{
      btn.onclick = ()=> startEditProduct(state.products.find(p=>p.id===btn.getAttribute('data-edit-product')));
    });
    root.querySelectorAll('[data-del-product]').forEach(btn=>{
      btn.onclick = ()=> deleteProduct(btn.getAttribute('data-del-product'));
    });

    if(editingProduct){
      document.getElementById('p-name').oninput = e=> editingProduct.name = e.target.value;
      document.getElementById('p-price').oninput = e=> editingProduct.price = e.target.value;
      document.getElementById('p-cat').onchange = e=> editingProduct.categoryId = e.target.value;
      document.getElementById('p-desc').oninput = e=> editingProduct.description = e.target.value;
      document.getElementById('p-featured').onchange = e=> editingProduct.featured = e.target.checked;
      const imgFile = document.getElementById('p-image-file');
      if(imgFile) imgFile.onchange = e=>{ if(e.target.files[0]) handleImageFile(e.target.files[0]); };
      const imgRemove = document.getElementById('p-image-remove');
      if(imgRemove) imgRemove.onclick = ()=>{ editingProduct.image=''; editingProduct.imageChanged=true; render(); };
      document.getElementById('cancel-product').onclick = ()=>{ editingProduct=null; render(); };
      document.getElementById('save-product').onclick = saveProduct;
    }
  }
}

loadData();
</script>
</body>
</html>
