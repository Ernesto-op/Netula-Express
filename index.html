<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netula Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#FAF7F2;
    --paper-2:#F1EAE0;
    --ink:#24211D;
    --ink-soft:#5B564E;
    --line:#E4DCCC;
    --brick:#A6402F;
    --brick-dark:#7E301F;
    --olive:#6B7A4C;
    --whatsapp:#25D366;
    --whatsapp-dark:#1DA851;
    --card:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', serif;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:15px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:720px; margin:0 auto; padding:16px 18px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{display:flex; flex-direction:column; min-width:0;}
  .brand h1{margin:0; font-size:22px; font-weight:600; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand span{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .mode-switch{
    display:flex; gap:6px; background:var(--paper-2); padding:4px; border-radius:999px; flex-shrink:0;
  }
  .mode-switch button{
    border:none; background:transparent; padding:7px 12px; border-radius:999px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .mode-switch button.active{background:var(--ink); color:var(--paper);}

  .container{max-width:720px; margin:0 auto; padding:18px 18px 120px;}

  /* ---------- Category tabs ---------- */
  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:10px 14px; margin-bottom:14px;
  }
  .search input{border:none; outline:none; flex:1; background:transparent; font-size:14.5px; color:var(--ink);}
  .tabs{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0; border:1px solid var(--line); background:var(--card);
    padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    white-space:nowrap;
  }
  .tab.active{background:var(--brick); border-color:var(--brick); color:#fff;}

  .cat-menu{display:flex; flex-direction:column; gap:10px;}
  .cat-menu-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 16px; text-align:left; width:100%;
  }
  .cat-menu-item span:first-child{font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--ink);}
  .cat-menu-count{font-size:12.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap;}
  .back-link{
    border:none; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:600;
    padding:0 0 14px; display:block;
  }
  .cat-view-title{font-size:22px; margin:0 0 16px;}

  /* ---------- Product cards ---------- */
  .product-list{display:flex; flex-direction:column; gap:12px;}
  .product{
    display:flex; gap:14px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px; align-items:center;
  }
  .product .thumb{
    width:96px; height:96px; border-radius:12px; flex-shrink:0; overflow:hidden;
    background:var(--paper-2); display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size:30px; color:var(--olive); font-weight:600;
  }
  .product .thumb img{width:100%; height:100%; object-fit:cover;}
  .product .info{flex:1; min-width:0;}
  .product .info h3{margin:0 0 2px; font-size:16px; font-weight:600; line-height:1.25;}
  .product .info p{margin:0 0 6px; font-size:12.5px; color:var(--ink-soft); line-height:1.35;}
  .product .price{font-weight:700; font-size:14.5px; color:var(--brick-dark);}
  .qty-row{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .qty-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
    font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .qty-val{min-width:16px; text-align:center; font-weight:600; font-size:14px;}
  .add-btn{
    border:none; background:var(--ink); color:#fff; border-radius:999px; padding:8px 14px;
    font-size:13px; font-weight:600;
  }
  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty .serif{font-size:19px; color:var(--ink); display:block; margin-bottom:6px;}

  /* ---------- Floating cart ---------- */
  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--ink); color:#fff;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .cart-bar-inner{
    max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .cart-bar .cart-info{font-size:13.5px; line-height:1.3;}
  .cart-bar .cart-info b{font-family:'Fraunces', serif; font-size:16px; display:block;}
  .cart-bar button{
    border:none; background:var(--whatsapp); color:#fff; padding:11px 18px; border-radius:999px;
    font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; flex-shrink:0;
  }

  /* ---------- Modal (cart detail) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(36,33,29,.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:720px; border-radius:20px 20px 0 0;
    max-height:85vh; overflow-y:auto; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h2{margin:0 0 14px; font-size:20px;}
  .cart-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .cart-line .name{flex:1; font-size:14.5px; font-weight:600;}
  .cart-line .sub{font-size:12px; color:var(--ink-soft); font-weight:400;}
  .cart-total-row{display:flex; justify-content:space-between; padding:14px 0 6px; font-weight:700; font-size:16px;}
  .close-x{
    position:absolute; top:14px; right:14px; border:none; background:var(--paper-2); width:30px; height:30px;
    border-radius:50%; font-size:16px; color:var(--ink-soft);
  }
  .sheet-wrap{position:relative;}
  .send-btn{
    width:100%; border:none; background:var(--whatsapp); color:#fff; padding:14px; border-radius:12px;
    font-weight:700; font-size:15px; margin-top:14px;
  }

  /* ---------- Admin ---------- */
  .section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
  .section-title h2{font-size:18px; margin:0;}
  .section-title:first-child{margin-top:0;}
  .pill-btn{
    border:1px solid var(--line); background:var(--card); padding:7px 13px; border-radius:999px;
    font-size:13px; font-weight:600; color:var(--ink);
  }
  .pill-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .admin-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;
  }
  .admin-card .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .admin-card .row + .row{margin-top:6px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field textarea, .field select{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:var(--paper); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .icon-btn{border:none; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; padding:4px 6px;}
  .icon-btn.danger{color:var(--brick-dark);}
  .form-actions{display:flex; gap:10px; margin-top:4px;}
  .form-actions .pill-btn{flex:1; text-align:center;}
  .muted{color:var(--ink-soft); font-size:13px;}
  .pin-wrap{
    max-width:320px; margin:80px auto; text-align:center; padding:0 20px;
  }
  .pin-wrap input{
    width:100%; text-align:center; letter-spacing:6px; font-size:22px; padding:12px; margin:16px 0;
    border:1px solid var(--line); border-radius:10px; background:var(--card);
  }
  .cat-chip{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card);
    padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600; margin:0 8px 8px 0;
  }
  .cat-chip button{border:none; background:transparent; color:var(--ink-soft); font-size:14px; line-height:1; padding:0;}
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 16px; border-radius:999px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .toast.show{opacity:1;}
  .img-picker{display:flex; align-items:center; gap:12px;}
  .img-preview{
    width:64px; height:64px; border-radius:10px; overflow:hidden; flex-shrink:0;
    background:var(--paper-2); display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:11px; text-align:center; border:1px solid var(--line);
  }
  .img-preview img{width:100%; height:100%; object-fit:cover;}
  .file-btn-wrap{position:relative; overflow:hidden; display:inline-block;}
  .file-btn-wrap input[type=file]{
    position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer;
  }
  .remove-img{border:none; background:transparent; color:var(--brick-dark); font-size:12.5px; font-weight:600; margin-left:auto;}
  .loading{text-align:center; padding:60px 20px; color:var(--ink-soft);}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
// ====== CONEXIÓN A LA BASE DE DATOS (Firebase) ======
// Reemplaza esto con el bloque "firebaseConfig" que te da la consola de Firebase
// (Configuración del proyecto → Tus apps → ícono </> ).
const firebaseConfig = {
  apiKey: "AIzaSyBIMuNTRL6D-bq7um-2trTNlomNPKX_RVo",
  authDomain: "netula-express.firebaseapp.com",
  projectId: "netula-express",
  storageBucket: "netula-express.firebasestorage.app",
  messagingSenderId: "874074235235",
  appId: "1:874074235235:web:769aa498ee098a151f3356"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FS_COLLECTION = 'catalogo';

async function fsGet(key){
  try{
    const snap = await db.collection(FS_COLLECTION).doc(key).get();
    return snap.exists ? snap.data().json : null;
  }catch(e){
    console.error('fsGet error', key, e);
    return null;
  }
}
async function fsSet(key, jsonStr){
  try{
    await db.collection(FS_COLLECTION).doc(key).set({json: jsonStr});
    return true;
  }catch(e){
    console.error('fsSet error', key, e);
    return false;
  }
}
// ====== FIN CONEXIÓN ======

const STORAGE_KEY = 'catalogo-data-v1';
let state = null;
let mode = 'cliente'; // cliente | admin | pin
let activeCategory = null; // null = mostrar el menú de categorías
let searchTerm = '';
let cart = {}; // productId -> qty
let showCartSheet = false;
let editingProduct = null; // {} for new, or product object copy
let editingCategoryName = '';
let pinInput = '';
let pinError = '';

function uid(){ return Math.random().toString(36).slice(2,10); }

// Las fotos se reparten en varios "grupos" para que ningún archivo guardado
// se acerque al límite de tamaño, sin importar cuántos productos tenga el catálogo.
const NUM_IMG_BUCKETS = 12;
let imageBuckets = {}; // bucketIndex -> {productId: dataUrl}
function bucketFor(id){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return h % NUM_IMG_BUCKETS;
}
function getProductImage(id){
  const b = imageBuckets[bucketFor(id)];
  return (b && b[id]) ? b[id] : '';
}
async function saveImageBucket(bucketIndex){
  const ok = await fsSet(`catalogo-img-${bucketIndex}`, JSON.stringify(imageBuckets[bucketIndex]||{}));
  if(!ok) showToast('No se pudo guardar la foto. Intenta de nuevo.');
}
function setProductImage(id, dataUrl){
  const b = bucketFor(id);
  if(!imageBuckets[b]) imageBuckets[b] = {};
  if(dataUrl){ imageBuckets[b][id] = dataUrl; } else { delete imageBuckets[b][id]; }
  saveImageBucket(b);
}

function seedData(){
  const cat1 = uid(), cat2 = uid();
  return {
    businessName: 'Netula Express',
    tagline: 'Escoge tus productos y envía tu pedido por WhatsApp',
    whatsappNumber: '',
    adminPin: '1234',
    categories: [
      {id: cat1, name: 'Destacados'},
      {id: cat2, name: 'Nuevos'}
    ],
    products: [
      {id: uid(), categoryId: cat1, name: 'Producto de ejemplo', price: 10.00, description: 'Edita este producto desde el panel de administrador.'}
    ]
  };
}

async function loadData(){
  const metaJson = await fsGet(STORAGE_KEY);
  state = metaJson ? JSON.parse(metaJson) : seedData();
  const bucketReads = [];
  for(let i=0;i<NUM_IMG_BUCKETS;i++){
    bucketReads.push(
      fsGet(`catalogo-img-${i}`).then(json => { imageBuckets[i] = json ? JSON.parse(json) : {}; })
    );
  }
  await Promise.all(bucketReads);
  render();
}

async function saveData(){
  const ok = await fsSet(STORAGE_KEY, JSON.stringify(state));
  if(!ok) showToast('No se pudo guardar. Revisa tu conexión.');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function fmt(n){
  return 'S/ ' + Number(n||0).toFixed(2);
}

function cartCount(){
  return Object.values(cart).reduce((a,b)=>a+b,0);
}
function cartTotal(){
  let t = 0;
  for(const pid in cart){
    const p = state.products.find(x=>x.id===pid);
    if(p) t += p.price * cart[pid];
  }
  return t;
}

function addToCart(pid, delta){
  const next = (cart[pid]||0) + delta;
  if(next <= 0){ delete cart[pid]; } else { cart[pid] = next; }
  render();
}

function buildWhatsAppMessage(){
  let lines = [`Hola, quiero hacer este pedido:`, ``];
  for(const pid in cart){
    const p = state.products.find(x=>x.id===pid);
    if(!p) continue;
    lines.push(`• ${p.name} x${cart[pid]} — ${fmt(p.price*cart[pid])}`);
  }
  lines.push(``, `Total: ${fmt(cartTotal())}`);
  return lines.join('\n');
}

function sendOrder(){
  if(!state.whatsappNumber){
    showToast('El negocio aún no configuró su número de WhatsApp.');
    return;
  }
  const num = state.whatsappNumber.replace(/[^0-9]/g,'');
  const msg = encodeURIComponent(buildWhatsAppMessage());
  window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
}

// ---------- Admin actions ----------
function checkPin(){
  if(pinInput === (state.adminPin || '1234')){
    mode = 'admin'; pinInput=''; pinError='';
  }else{
    pinError = 'PIN incorrecto';
  }
  render();
}

function addCategory(){
  const name = editingCategoryName.trim();
  if(!name) return;
  state.categories.push({id: uid(), name});
  editingCategoryName = '';
  saveData(); render();
}
function removeCategory(id){
  const hasProducts = state.products.some(p=>p.categoryId===id);
  if(hasProducts){
    showToast('Primero mueve o borra los productos de esta categoría.');
    return;
  }
  state.categories = state.categories.filter(c=>c.id!==id);
  saveData(); render();
}

function downloadTemplate(){
  const csv = "Categoria,Producto,Precio,Descripcion\nBebidas,Gaseosa 500ml,3.50,Bien fria\nComidas,Hamburguesa clasica,12.00,Con papas incluidas\n";
  const blob = new Blob(["\uFEFF" + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'plantilla-productos.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parsePrice(val){
  if(typeof val === 'number') return val;
  const cleaned = String(val||'').replace(/[^0-9.,-]/g,'').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function handleExcelImport(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length === 0){ showToast('El archivo está vacío.'); return; }

      const catMap = {};
      state.categories.forEach(c=> catMap[c.name.trim().toLowerCase()] = c.id);

      let created = 0, catsCreated = 0;
      rows.forEach(row=>{
        const prodName = String(row.Producto || row.producto || row.Product || '').trim();
        if(!prodName) return;
        const catName = String(row.Categoria || row.categoria || row.Category || '').trim();
        const price = parsePrice(row.Precio ?? row.precio ?? row.Price ?? 0);
        const desc = String(row.Descripcion || row.descripcion || row.Description || '').trim();

        const key = catName ? catName.toLowerCase() : 'sin categoría';
        let catId = catMap[key];
        if(!catId){
          catId = uid();
          state.categories.push({id: catId, name: catName || 'Sin categoría'});
          catMap[key] = catId;
          catsCreated++;
        }

        state.products.push({id: uid(), categoryId: catId, name: prodName, price, description: desc});
        created++;
      });

      if(created===0){
        showToast('No se encontró ningún producto válido en el archivo.');
        return;
      }
      saveData();
      render();
      showToast(`Se importaron ${created} productos${catsCreated? ` y se crearon ${catsCreated} categorías`:''}.`);
    }catch(err){
      console.error(err);
      showToast('No se pudo leer el archivo. Revisa que sea un Excel o CSV válido.');
    }
  };
  reader.onerror = ()=> showToast('No se pudo leer el archivo.');
  reader.readAsArrayBuffer(file);
}

function startNewProduct(){
  const firstCat = state.categories[0] ? state.categories[0].id : '';
  editingProduct = {id: null, name:'', price:'', categoryId:firstCat, description:'', image:''};
  render();
}
function startEditProduct(p){
  editingProduct = {...p, image: getProductImage(p.id)};
  render();
}
function handleImageFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.62);
      if(editingProduct) editingProduct.image = dataUrl;
      render();
    };
    img.onerror = ()=> showToast('No se pudo leer esa imagen.');
    img.src = e.target.result;
  };
  reader.onerror = ()=> showToast('No se pudo leer esa imagen.');
  reader.readAsDataURL(file);
}

function saveProduct(){
  if(!editingProduct.name.trim() || editingProduct.price===''){
    showToast('Falta el nombre o el precio.');
    return;
  }
  const priceNum = parseFloat(editingProduct.price);
  const imageValue = editingProduct.image || '';
  let productId = editingProduct.id;
  const meta = {
    id: productId || undefined,
    categoryId: editingProduct.categoryId,
    name: editingProduct.name,
    price: priceNum,
    description: editingProduct.description
  };
  if(productId){
    const idx = state.products.findIndex(p=>p.id===productId);
    state.products[idx] = {...meta, id: productId};
  }else{
    productId = uid();
    state.products.push({...meta, id: productId});
  }
  setProductImage(productId, imageValue);
  editingProduct = null;
  saveData(); render();
}
function deleteProduct(id){
  state.products = state.products.filter(p=>p.id!==id);
  setProductImage(id, '');
  saveData(); render();
}

// ---------- Render ----------
function render(){
  const root = document.getElementById('root');
  if(!state){ root.innerHTML = '<div class="loading">Cargando catálogo…</div>'; return; }

  if(mode === 'pin'){
    root.innerHTML = renderPin();
    bindPin();
    return;
  }

  let html = renderTopbar();
  if(mode === 'cliente'){
    html += renderCliente();
  }else{
    html += renderAdmin();
  }
  root.innerHTML = html;
  bindEvents();
}

function renderTopbar(){
  return `
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>${escapeHtml(state.businessName || 'Mi Catálogo')}</h1>
        ${mode==='cliente' ? `<span>${escapeHtml(state.tagline||'')}</span>` : `<span>Panel de administrador</span>`}
      </div>
      <div class="mode-switch">
        <button data-action="go-cliente" class="${mode==='cliente'?'active':''}">Cliente</button>
        <button data-action="go-admin" class="${mode==='admin'?'active':''}">Admin</button>
      </div>
    </div>
  </div>`;
}

function renderPin(){
  return `
  <div class="pin-wrap">
    <h2 class="serif">Panel de administrador</h2>
    <p class="muted">Ingresa tu PIN para editar el catálogo.</p>
    <input id="pin-field" type="password" inputmode="numeric" maxlength="8" placeholder="••••" value="${escapeHtml(pinInput)}">
    ${pinError? `<p class="muted" style="color:var(--brick-dark)">${pinError}</p>`:''}
    <button class="pill-btn primary" id="pin-submit" style="width:100%">Entrar</button>
    <p class="muted" style="margin-top:14px;"><button class="icon-btn" id="pin-cancel">Volver al catálogo</button></p>
  </div>`;
}

function bindPin(){
  const field = document.getElementById('pin-field');
  field.focus();
  field.oninput = e => pinInput = e.target.value;
  field.onkeydown = e => { if(e.key==='Enter') checkPin(); };
  document.getElementById('pin-submit').onclick = checkPin;
  document.getElementById('pin-cancel').onclick = () => { mode='cliente'; pinInput=''; pinError=''; render(); };
}

function categoryProductCount(catId){
  return state.products.filter(p=>p.categoryId===catId).length;
}

function renderCategoryMenu(){
  const cats = state.categories;
  let html = `<div class="container">`;
  html += `<div class="search"><span>🔎</span><input id="search-field" placeholder="Buscar producto…" value="${escapeHtml(searchTerm)}"></div>`;
  if(cats.length===0){
    html += `<div class="empty"><span class="serif">Aún no hay categorías</span>El negocio está preparando su catálogo.</div>`;
  }else{
    html += `<div class="cat-menu">`;
    cats.forEach(c=>{
      html += `
      <button class="cat-menu-item" data-cat="${c.id}">
        <span>${escapeHtml(c.name)}</span>
        <span class="cat-menu-count">${categoryProductCount(c.id)} producto${categoryProductCount(c.id)!==1?'s':''} ›</span>
      </button>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function renderProductView(catId){
  let products = state.products;
  let title = 'Todos los productos';
  if(searchTerm.trim()){
    const s = searchTerm.trim().toLowerCase();
    products = products.filter(p=> p.name.toLowerCase().includes(s) || (p.description||'').toLowerCase().includes(s));
    title = `Resultados para "${searchTerm.trim()}"`;
  }else if(catId){
    products = products.filter(p=>p.categoryId===catId);
    const cat = state.categories.find(c=>c.id===catId);
    title = cat ? cat.name : 'Productos';
  }

  let html = `<div class="container">`;
  if(!searchTerm.trim()){
    html += `<button class="back-link" id="back-to-menu">‹ Categorías</button>`;
  }
  html += `<h2 class="cat-view-title serif">${escapeHtml(title)}</h2>`;

  if(products.length===0){
    html += `<div class="empty"><span class="serif">Nada por aquí todavía</span>Prueba con otra categoría o búsqueda.</div>`;
  }else{
    html += `<div class="product-list">`;
    products.forEach(p=>{
      const qty = cart[p.id]||0;
      html += `
      <div class="product">
        <div class="thumb">${getProductImage(p.id) ? `<img src="${getProductImage(p.id)}" alt="">` : escapeHtml((p.name||'?').charAt(0).toUpperCase())}</div>
        <div class="info">
          <h3>${escapeHtml(p.name)}</h3>
          ${p.description? `<p>${escapeHtml(p.description)}</p>`:''}
          <div class="price">${fmt(p.price)}</div>
        </div>
        ${qty===0 ? `<button class="add-btn" data-add="${p.id}">Añadir</button>` :
        `<div class="qty-row">
            <button class="qty-btn" data-dec="${p.id}">–</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" data-inc="${p.id}">+</button>
          </div>`}
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function renderCliente(){
  let html;
  if(searchTerm.trim()){
    html = renderProductView(activeCategory);
  }else if(activeCategory === null){
    html = renderCategoryMenu();
  }else{
    html = renderProductView(activeCategory);
  }

  if(cartCount()>0){
    html += `
    <div class="cart-bar">
      <div class="cart-bar-inner">
        <div class="cart-info"><b>${cartCount()} producto${cartCount()>1?'s':''}</b>${fmt(cartTotal())}</div>
        <button id="open-cart">Ver pedido</button>
      </div>
    </div>`;
  }

  if(showCartSheet){
    html += renderCartSheet();
  }

  return html;
}

function renderCartSheet(){
  let html = `<div class="overlay" id="overlay">
    <div class="sheet sheet-wrap">
      <button class="close-x" id="close-sheet">✕</button>
      <h2 class="serif">Tu pedido</h2>`;
  for(const pid in cart){
    const p = state.products.find(x=>x.id===pid);
    if(!p) continue;
    html += `
    <div class="cart-line">
      <div class="name">${escapeHtml(p.name)}<div class="sub">${fmt(p.price)} c/u</div></div>
      <div class="qty-row">
        <button class="qty-btn" data-dec="${p.id}">–</button>
        <span class="qty-val">${cart[pid]}</span>
        <button class="qty-btn" data-inc="${p.id}">+</button>
      </div>
    </div>`;
  }
  html += `
      <div class="cart-total-row"><span>Total</span><span>${fmt(cartTotal())}</span></div>
      <button class="send-btn" id="send-order">Enviar pedido por WhatsApp</button>
    </div>
  </div>`;
  return html;
}

function renderAdmin(){
  let html = `<div class="container">`;

  // Settings
  html += `<div class="section-title"><h2 class="serif">Datos del negocio</h2></div>`;
  html += `<div class="admin-card">
    <div class="field"><label>Nombre del negocio</label><input id="f-business" value="${escapeHtml(state.businessName)}"></div>
    <div class="field"><label>Frase corta (debajo del nombre)</label><input id="f-tagline" value="${escapeHtml(state.tagline||'')}"></div>
    <div class="field"><label>Tu WhatsApp (con código de país, solo números)</label><input id="f-whatsapp" placeholder="Ej. 51987654321" value="${escapeHtml(state.whatsappNumber||'')}"></div>
    <div class="field"><label>PIN de administrador</label><input id="f-pin" value="${escapeHtml(state.adminPin||'')}"></div>
    <button class="pill-btn primary" id="save-settings">Guardar datos</button>
  </div>`;

  // Categories
  // Importar desde Excel
  html += `<div class="section-title"><h2 class="serif">Importar productos desde Excel</h2></div>`;
  html += `<div class="admin-card">
    <p class="muted" style="margin:0 0 12px;">Sube un archivo Excel (.xlsx) o CSV con las columnas <b>Categoria, Producto, Precio, Descripcion</b> (la descripción es opcional). Las categorías que no existan se crean solas. Las fotos se agregan después, una por una, desde cada producto.</p>
    <button type="button" class="pill-btn" id="download-template" style="width:100%; margin-bottom:10px;">Descargar plantilla de ejemplo</button>
    <div class="file-btn-wrap" style="display:block; width:100%;">
      <button type="button" class="pill-btn primary" style="width:100%;">Elegir archivo Excel o CSV</button>
      <input type="file" id="import-excel-file" accept=".xlsx,.xls,.csv">
    </div>
  </div>`;

  html += `<div class="section-title"><h2 class="serif">Categorías</h2></div>`;
  html += `<div class="admin-card">`;
  if(state.categories.length===0){ html += `<p class="muted">Aún no tienes categorías.</p>`; }
  state.categories.forEach(c=>{
    html += `<span class="cat-chip">${escapeHtml(c.name)} <button data-del-cat="${c.id}">✕</button></span>`;
  });
  html += `
    <div class="field-row" style="margin-top:10px;">
      <div class="field" style="margin-bottom:0;"><input id="new-cat" placeholder="Nueva categoría" value="${escapeHtml(editingCategoryName)}"></div>
      <button class="pill-btn primary" id="add-cat" style="flex-shrink:0;">Añadir</button>
    </div>
  </div>`;

  // Products
  html += `<div class="section-title"><h2 class="serif">Productos</h2><button class="pill-btn primary" id="new-product">+ Nuevo</button></div>`;

  if(editingProduct){
    const cats = state.categories;
    html += `<div class="admin-card">
      <div class="field"><label>Nombre</label><input id="p-name" value="${escapeHtml(editingProduct.name)}"></div>
      <div class="field-row">
        <div class="field"><label>Precio</label><input id="p-price" type="number" step="0.01" value="${escapeHtml(String(editingProduct.price))}"></div>
        <div class="field"><label>Categoría</label>
          <select id="p-cat">
            ${cats.map(c=>`<option value="${c.id}" ${editingProduct.categoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field"><label>Descripción (opcional)</label><textarea id="p-desc">${escapeHtml(editingProduct.description||'')}</textarea></div>
      <div class="field">
        <label>Foto del producto (opcional)</label>
        <div class="img-picker">
          <div class="img-preview" id="p-image-preview">${editingProduct.image ? `<img src="${editingProduct.image}">` : 'Sin foto'}</div>
          <div class="file-btn-wrap">
            <button type="button" class="pill-btn" id="p-image-btn-label">${editingProduct.image ? 'Cambiar foto' : 'Elegir foto'}</button>
            <input type="file" id="p-image-file" accept="image/*">
          </div>
          ${editingProduct.image ? `<button type="button" class="remove-img" id="p-image-remove">Quitar</button>` : ''}
        </div>
      </div>
      <div class="form-actions">
        <button class="pill-btn" id="cancel-product">Cancelar</button>
        <button class="pill-btn primary" id="save-product">Guardar producto</button>
      </div>
    </div>`;
  }

  if(state.products.length===0 && !editingProduct){
    html += `<p class="muted">Aún no tienes productos. Toca "+ Nuevo" para agregar el primero.</p>`;
  }
  state.products.forEach(p=>{
    const cat = state.categories.find(c=>c.id===p.categoryId);
    html += `
    <div class="admin-card">
      <div class="row">
        <div>
          <div style="font-weight:600;">${escapeHtml(p.name)}</div>
          <div class="muted">${cat?escapeHtml(cat.name):'Sin categoría'} · ${fmt(p.price)}</div>
        </div>
        <div>
          <button class="icon-btn" data-edit-product="${p.id}">Editar</button>
          <button class="icon-btn danger" data-del-product="${p.id}">Borrar</button>
        </div>
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function bindEvents(){
  const root = document.getElementById('root');

  const goCliente = root.querySelector('[data-action="go-cliente"]');
  if(goCliente) goCliente.onclick = ()=>{ mode='cliente'; render(); };
  const goAdmin = root.querySelector('[data-action="go-admin"]');
  if(goAdmin) goAdmin.onclick = ()=>{ mode = (mode==='admin') ? 'admin' : 'pin'; render(); };

  if(mode==='cliente'){
    const sf = document.getElementById('search-field');
    if(sf){ sf.oninput = e=>{ searchTerm = e.target.value; render(); document.getElementById('search-field').focus(); document.getElementById('search-field').selectionStart = document.getElementById('search-field').value.length; }; }

    root.querySelectorAll('[data-cat]').forEach(btn=>{
      btn.onclick = ()=>{ activeCategory = btn.getAttribute('data-cat'); searchTerm=''; render(); };
    });
    const backToMenu = document.getElementById('back-to-menu');
    if(backToMenu) backToMenu.onclick = ()=>{ activeCategory = null; searchTerm=''; render(); };
    root.querySelectorAll('[data-add]').forEach(btn=>{
      btn.onclick = ()=> addToCart(btn.getAttribute('data-add'), 1);
    });
    root.querySelectorAll('[data-inc]').forEach(btn=>{
      btn.onclick = ()=> addToCart(btn.getAttribute('data-inc'), 1);
    });
    root.querySelectorAll('[data-dec]').forEach(btn=>{
      btn.onclick = ()=> addToCart(btn.getAttribute('data-dec'), -1);
    });
    const openCart = document.getElementById('open-cart');
    if(openCart) openCart.onclick = ()=>{ showCartSheet=true; render(); };
    const closeSheet = document.getElementById('close-sheet');
    if(closeSheet) closeSheet.onclick = ()=>{ showCartSheet=false; render(); };
    const overlay = document.getElementById('overlay');
    if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='overlay'){ showCartSheet=false; render(); } };
    const sendBtn = document.getElementById('send-order');
    if(sendBtn) sendBtn.onclick = sendOrder;
  }

  if(mode==='admin'){
    const saveSettings = document.getElementById('save-settings');
    if(saveSettings) saveSettings.onclick = ()=>{
      state.businessName = document.getElementById('f-business').value.trim() || 'Mi Catálogo';
      state.tagline = document.getElementById('f-tagline').value.trim();
      state.whatsappNumber = document.getElementById('f-whatsapp').value.trim();
      state.adminPin = document.getElementById('f-pin').value.trim() || '1234';
      saveData(); showToast('Datos guardados'); render();
    };

    const dlTemplate = document.getElementById('download-template');
    if(dlTemplate) dlTemplate.onclick = downloadTemplate;
    const importFile = document.getElementById('import-excel-file');
    if(importFile) importFile.onchange = e=>{ if(e.target.files[0]) handleExcelImport(e.target.files[0]); };

    const newCat = document.getElementById('new-cat');
    if(newCat) newCat.oninput = e=> editingCategoryName = e.target.value;
    const addCat = document.getElementById('add-cat');
    if(addCat) addCat.onclick = addCategory;
    root.querySelectorAll('[data-del-cat]').forEach(btn=>{
      btn.onclick = ()=> removeCategory(btn.getAttribute('data-del-cat'));
    });

    const newProduct = document.getElementById('new-product');
    if(newProduct) newProduct.onclick = startNewProduct;
    root.querySelectorAll('[data-edit-product]').forEach(btn=>{
      btn.onclick = ()=> startEditProduct(state.products.find(p=>p.id===btn.getAttribute('data-edit-product')));
    });
    root.querySelectorAll('[data-del-product]').forEach(btn=>{
      btn.onclick = ()=> deleteProduct(btn.getAttribute('data-del-product'));
    });

    if(editingProduct){
      document.getElementById('p-name').oninput = e=> editingProduct.name = e.target.value;
      document.getElementById('p-price').oninput = e=> editingProduct.price = e.target.value;
      document.getElementById('p-cat').onchange = e=> editingProduct.categoryId = e.target.value;
      document.getElementById('p-desc').oninput = e=> editingProduct.description = e.target.value;
      const imgFile = document.getElementById('p-image-file');
      if(imgFile) imgFile.onchange = e=>{ if(e.target.files[0]) handleImageFile(e.target.files[0]); };
      const imgRemove = document.getElementById('p-image-remove');
      if(imgRemove) imgRemove.onclick = ()=>{ editingProduct.image=''; render(); };
      document.getElementById('cancel-product').onclick = ()=>{ editingProduct=null; render(); };
      document.getElementById('save-product').onclick = saveProduct;
    }
  }
}

loadData();
</script>
</body>
</html>
